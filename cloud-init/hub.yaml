#cloud-config
# Hub VM cloud-init: installs Docker, deploys Open Horizon management hub,
# starts the local Docker registry, and writes credential files to /root/.

package_update: true
package_upgrade: false

packages:
  - docker.io
  - curl
  - jq
  - python3
  - net-tools
  - ufw

runcmd:
  # ── Enable and start Docker ──────────────────────────────────────────────
  - systemctl enable docker
  - systemctl start docker

  # ── Open firewall ports for Open Horizon hub services ────────────────────
  - ufw allow 3090/tcp
  - ufw allow 3111/tcp
  - ufw allow 9008/tcp
  - ufw allow 9443/tcp
  - ufw allow 5000/tcp

  # ── Start local Docker registry (port 5000) ───────────────────────────────
  - mkdir -p /var/lib/registry
  - |
    if ! docker ps -a --format '{{.Names}}' | grep -qx registry; then
      docker run -d \
        --name registry \
        --restart=always \
        -p 5000:5000 \
        -v /var/lib/registry:/var/lib/docker/registry \
        registry:2
    else
      docker start registry >/dev/null 2>&1 || true
    fi
  - |
    echo "Waiting for registry to be ready..."
    for i in $(seq 1 30); do
      if curl -sf http://localhost:5000/v2/ >/dev/null 2>&1; then
        echo "✓ Registry is ready"
        break
      fi
      if [ "$i" -eq 30 ]; then
        echo "ERROR: Registry failed to start" >&2
        docker logs registry 2>&1 | tail -20
        exit 1
      fi
      sleep 10
    done
  - echo "✓ Cloud-init complete - Docker and registry ready"
  - echo "✓ Exchange installation will be triggered by Makefile after VM provisioning"
