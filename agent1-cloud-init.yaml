#cloud-config
# Agent VM cloud-init template.
# Rendered at launch time by the Makefile using envsubst.
# Substitution tokens: 10.144.142.121, myorg, admin:cWD726rcJegpHzAwAqi5ZWosHYrWN2, 1
# All other shell variable references ($ID, $i, etc.) are escaped as \$VAR in runcmd
# scripts to prevent envsubst from replacing them.

package_update: true
package_upgrade: false

packages:
  - docker.io
  - curl
  - jq
  - net-tools

runcmd:
  # ── Enable and start Docker ──────────────────────────────────────────────
  - systemctl enable docker
  - systemctl start docker

  # ── Configure Docker insecure registry for hub (10.144.142.121:5000) ──────────
  - mkdir -p /etc/docker
  - |
    if [ -f /etc/docker/daemon.json ] && [ -s /etc/docker/daemon.json ]; then
      cp /etc/docker/daemon.json /etc/docker/daemon.json.backup
      if command -v jq >/dev/null 2>&1; then
        jq '. + {"insecure-registries": ["10.144.142.121:5000"]}' /etc/docker/daemon.json \
          > /etc/docker/daemon.json.tmp
        mv /etc/docker/daemon.json.tmp /etc/docker/daemon.json
      else
        sed -i 's/}$/,"insecure-registries": ["10.144.142.121:5000"]}/' /etc/docker/daemon.json
      fi
    else
      printf '{\n  "insecure-registries": ["%s:5000"]\n}\n' "10.144.142.121" > /etc/docker/daemon.json
    fi
  - systemctl restart docker
  - |
    for i in \$(seq 1 30); do
      if docker info >/dev/null 2>&1; then
        echo "✓ Docker restarted"
        break
      fi
      if [ "\$i" -eq 30 ]; then
        echo "ERROR: Docker failed to restart" >&2
        exit 1
      fi
      sleep 2
    done

  # ── Write agent install config ────────────────────────────────────────────
  - touch /root/agent-install.crt
  - |
    cat > /root/agent-install.cfg <<EOF
    HZN_ORG_ID=myorg
    HZN_EXCHANGE_USER_AUTH=admin:cWD726rcJegpHzAwAqi5ZWosHYrWN2
    HZN_EXCHANGE_URL=http://10.144.142.121:3090/v1
    HZN_FSS_CSSURL=http://10.144.142.121:9443/
    HZN_AGBOT_URL=http://10.144.142.121:3111
    HZN_FDO_SVC_URL=http://10.144.142.121:9008/api
    EOF

  # ── Install Open Horizon agent ────────────────────────────────────────────
  - |
    export HZN_ORG_ID="myorg"
    export HZN_EXCHANGE_USER_AUTH="admin:cWD726rcJegpHzAwAqi5ZWosHYrWN2"
    export HZN_EXCHANGE_URL="http://10.144.142.121:3090/v1"
    export HZN_FSS_CSSURL="http://10.144.142.121:9443/"
    export HZN_AGBOT_URL="http://10.144.142.121:3111"
    export HZN_FDO_SVC_URL="http://10.144.142.121:9008/api"
    curl -sSL https://raw.githubusercontent.com/open-horizon/anax/refs/heads/master/agent-install/agent-install.sh \
      | bash -s -- -i anax: -k /root/agent-install.cfg -c css: \
          -p IBM/pattern-ibm.helloworld -w '*' -T 120

  # ── Verify agent is running ───────────────────────────────────────────────
  - |
    for i in \$(seq 1 30); do
      if hzn node list >/dev/null 2>&1; then
        echo "✓ Agent is running"
        break
      fi
      if [ "\$i" -eq 30 ]; then
        echo "ERROR: Agent failed to start after 2.5 minutes" >&2
        exit 1
      fi
      sleep 5
    done
  - |
    if ! hzn exchange status >/dev/null 2>&1; then
      echo "ERROR: Cannot connect to Exchange at 10.144.142.121" >&2
      exit 1
    fi
    echo "✓ Agent provisioning complete and healthy (agent 1)"
